<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Astro-Type</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- HOME SCREEN -->
  <section id="home-screen" class="screen hidden">

    <div class="stars"></div>

    <div class="home-content">

      <h1 class="title">ASTRO-TYPE</h1>

      <select id="language-select">
        <option>HTML</option>
        <option>CSS</option>
        <option>JavaScript</option>
      </select>

      <button id="start-btn">Start</button>

    </div>

  </section>



  <!-- GAME SCREEN -->
  <section id="game-screen" class="screen">

    <div class="hud">

      <div class="score">
        SCORE: <span id="score">00000</span>
      </div>

      <div class="streak">
        🔥 <span id="streak">0</span>
      </div>

    </div>



    <!-- ASTEROID CONTAINER, WILL CHANGE -->
    <div id="game-area">

      <!-- EXAMPLE ASTEROIDS-->
      <div class="asteroid asteroid-1">
        <img src="assets/images/asteroid.png" alt="asteroid">

        <p class="snippet">
          const score = 0;
        </p>
      </div>

      <div class="asteroid asteroid-2">
        <img src="assets/images/asteroid.png" alt="asteroid">

        <p class="snippet">
          let health = 100;
        </p>
      </div>

      <div class="asteroid asteroid-3">
        <img src="assets/images/asteroid.png" alt="asteroid">

        <p class="snippet">
          console.log("hello");
        </p>
      </div>

    </div>



    <!-- TYPING INPUT -->
    <div class="typing-container">

      <input
        type="text"
        id="typing-input"
        placeholder="Type here..."
        autocomplete="off"
      />

    </div>

  </section>



  <!-- RESULTS SCREEN -->
  <section id="results-screen" class="screen hidden">

    <div class="results-card">

      <h2>GAME OVER</h2>

      <div class="stats">

        <p>FINAL SCORE: <span id="final-score">0</span></p>

        <p>ACCURACY: <span id="accuracy">100%</span></p>

        <p>LONGEST STREAK: <span id="longest-streak">0</span></p>

        <p>ASTEROIDS DESTROYED: <span id="destroyed">0</span></p>

      </div>

      <button id="play-again-btn">
        Play Again
      </button>

    </div>

  </section>



  <script type="module" src="main.js"></script>

</body>
</html>

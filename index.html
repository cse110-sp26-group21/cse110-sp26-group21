<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Astro-Type</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@400;700&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <!-- =========================
       HOME SCREEN
  ========================== -->

  <section id="home-screen" class="screen">

    <div class="home-content">

      <h1 class="title">
        ASTRO-TYPE
      </h1>

      <!-- Game mode selection -->
      <select id="language-select">

        <option value="javascript">
          JavaScript
        </option>

        <option value="html">
          HTML
        </option>

        <option value="css">
          CSS
        </option>

      </select>

      <div class="difficulty-selector">

        <label
          class="difficulty-label"
          for="difficulty-slider"
        >
          Difficulty:
          <span id="difficulty-value">
            Easy
          </span>
        </label>

        <div class="difficulty-scale" aria-hidden="true">
          <span>Easy</span>
          <span>Medium</span>
          <span>Hard</span>
        </div>

        <input
          type="range"
          id="difficulty-slider"
          min="0"
          max="2"
          step="1"
          value="0"
          aria-label="Difficulty slider"
        />

      </div>

      <!-- Start game button -->
      <button id="start-btn">
        Start Game
      </button>

      <!-- Tutorial button -->
      <button id="tutorial-btn" class="tutorial-btn">
        TUTORIAL
      </button>

    </div>

  </section>

  <!-- =========================
       GAME SCREEN
  ========================== -->

  <section id="game-screen" class="screen hidden">

    <!-- HUD -->
    <div class="hud">

      <div class="score">
        SCORE:
        <span id="score">
          0
        </span>
      </div>
      
      <!-- Shows how many asteroids have appeared in this level -->
      <div class="asteroid-counter">
  ASTEROIDS: <span id="asteroid-count">0</span>/<span id="asteroid-total">10</span>
      </div> 

      <div class="streak">
        🔥
        <span id="streak">
          0
        </span>
      </div>

    </div>

    <!-- Asteroids spawn here -->
    <div id="game-area"></div>

    <!-- Typing input -->
    <div class="typing-container">

      <input
        type="text"
        id="typing-input"
        placeholder="Type code here..."
        autocomplete="off"
      />

    </div>

  </section>

  <!-- =========================
       TUTORIAL SCREEN
  ========================== -->

  <section id="tutorial-screen" class="screen hidden">

    <!-- HUD -->
    <div class="hud">

      <div class="score">
        SCORE:
        <span id="tutorial-score">
          0
        </span>
      </div>
      
      <!-- Shows how many asteroids have appeared in this level -->
      <div class="asteroid-counter">
  ASTEROIDS: <span id="tutorial-asteroid-count">0</span>/<span id="tutorial-asteroid-total">1</span>
      </div> 

      <div class="streak">
        🔥
        <span id="tutorial-streak">
          0
        </span>
      </div>

    </div>

    <!-- Asteroids spawn here -->
    <div id="tutorial-game-area"></div>

    <!-- Typing input -->
    <div class="typing-container">

      <input
        type="text"
        id="tutorial-typing-input"
        placeholder="Type code here..."
        autocomplete="off"
      />

    </div>

  </section>

  <!-- =========================
       RESULTS SCREEN
  ========================== -->

  <section id="results-screen" class="screen hidden">

    <div class="results-card">

      <h2>
        GAME OVER
      </h2>

      <div class="stats">

        <p>
          FINAL SCORE: <br>
          <span id="final-score">0</span>
        </p>

        <p>
          ASTEROIDS DESTROYED: <br>
          <span id="destroyed-count">0</span>
        </p>

        <p>
          LONGEST STREAK: <br>
          <span id="longest-streak">0</span>
        </p>

        <p>
          Session High Score: <br>
          <span id="session-high-score">0</span>
        </p>

      </div>

      <button id="play-again-btn">
        Play Again
      </button>

    </div>

  </section>


  <!-- Main script -->
  <script
    type="module"
    src="./scripts/main.js"
  ></script>

</body>
</html>
